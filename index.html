<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collatz conjecture paths</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 1rem; bottom: 1rem;
        font: 14px Georgia, serif; color: #b5367a;
      }
      #controls {
        position: fixed; top: 1rem; right: 1rem; max-width: calc(100vw - 2rem);
        padding: 0.5rem 0.75rem; border-radius: 6px;
        background: rgba(255, 255, 255, 0.85); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        font: 13px system-ui, sans-serif; color: #333;
      }
      #controls summary { cursor: pointer; font-weight: 600; }
      #params {
        display: grid; grid-template-columns: auto 9rem 6rem;
        gap: 0.35rem 0.5rem; align-items: center; margin: 0.5rem 0;
      }
      #params input[type='number'] { width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="hud"></div>
    <details id="controls" open>
      <summary>Parameters</summary>
      <div id="params"></div>
      <button id="reset" type="button">Reset to reference values</button>
    </details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
